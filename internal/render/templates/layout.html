{{define "head"}}
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{.DocTitle}}</title>
  <link rel="stylesheet" href="{{.Site.AssetURL}}">
  <script src="{{.Site.ScriptURL}}"></script>
{{end}}

{{define "header"}}
  <header class="site-header">
    <a class="site-title" href="{{.Site.HomeURL}}">{{.Site.Title}}</a>
    <div class="site-tools">
      <nav class="site-nav">
        <a href="{{.Site.HomeURL}}">Home</a>
        <a href="{{.Site.IndexURL}}">Index</a>
        <a href="{{.Site.TypesURL}}">Types</a>
        <a href="{{.Site.TagsURL}}">Tags</a>
        <a href="{{.Site.GraphURL}}">Graph</a>
      </nav>
      <button class="theme-toggle" type="button" aria-label="Toggle light and dark theme" data-theme-toggle hidden><svg class="icon-sun" viewBox="0 0 24 24" width="15" height="15" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg><svg class="icon-moon" viewBox="0 0 24 24" width="15" height="15" aria-hidden="true" focusable="false"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"></path></svg></button>
    </div>
    {{if .Site.SearchURL}}
    <form class="search" action="{{.Site.SearchURL}}" method="get" role="search">
      <span class="search-input"><svg class="icon-search" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="11" cy="11" r="7"></circle><path d="m21 21-4.3-4.3"></path></svg><input type="search" name="q" placeholder="Search" aria-label="Search the pages"></span>
    </form>
    {{end}}
  </header>
{{end}}

{{define "footer"}}
  <footer class="site-footer">
    <p>Built with stemma.</p>
  </footer>
{{end}}
