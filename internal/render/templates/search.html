{{define "search"}}<!doctype html>
<html lang="en">
<head>
{{template "head" .}}
</head>
<body>
{{template "header" .}}
<main>
  <h1>Search</h1>
  <form class="search" action="{{.Site.SearchURL}}" method="get" role="search">
    <span class="search-input"><svg class="icon-search" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="11" cy="11" r="7"></circle><path d="m21 21-4.3-4.3"></path></svg><input type="search" name="q" value="{{.Query}}" aria-label="Search the pages" autofocus></span>
    <button type="submit">Search</button>
  </form>
  {{if .Searched}}
    {{if .Hits}}
    <ol class="results">
      {{range .Hits}}<li>
        <a href="{{.URL}}">{{.Title}}</a>
        {{if .Snippet}}<p class="snippet">{{.Snippet}}</p>{{end}}
      </li>{{end}}
    </ol>
    {{else}}
    <p class="empty">No pages match "{{.Query}}".</p>
    {{end}}
  {{end}}
</main>
{{template "footer" .}}
</body>
</html>
{{end}}
