{{define "source-text"}}<!doctype html>
<html lang="en">
<head>
{{template "head" .}}
</head>
<body>
{{template "header" .}}
<main>
  <article class="page source-text">
    <h1>{{.Title}}</h1>
    <p class="meta">captured text of <a href="{{.RecordURL}}">{{.Key}}</a></p>
    <pre class="capture">{{.Text}}</pre>
  </article>
</main>
{{template "footer" .}}
</body>
</html>
{{end}}
